# Kitchen Solution Platform - demo reverse proxy (단일 호스트, basic auth).
#
# 구조:
#   / → frontend:3000 (Next.js)
#   /api, /docs, /openapi.json → backend:8000 (FastAPI)
#   전 경로에 Basic Auth (htpasswd) 적용 — 외부 노출 1차 방어.
#
# HTTPS 추가 (도메인 있을 때):
#   1) 호스트에 certbot 으로 cert 발급 → ./nginx/certs 마운트
#   2) 아래 ssl 블록 주석 해제, listen 80 은 redirect 로 변경

events {
  worker_connections 1024;
}

http {
  # 보고서 다운로드 (PPT/Word/Excel) 대비 — slim 한 timeout 으로 충분
  client_max_body_size 100M;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # gzip — 보고서는 이미 압축 형식이라 html/json 만
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  upstream backend {
    server backend:8000;
  }

  upstream frontend {
    server frontend:3000;
  }

  # ── Basic Auth 기본값 — htpasswd 파일이 ./nginx/htpasswd 에 있어야 함 ──
  # 생성: docker run --rm httpd:alpine htpasswd -nbB demo <비번> > nginx/htpasswd
  # (또는 호스트에 apache2-utils 설치 후: htpasswd -cBb nginx/htpasswd demo <비번>)
  #
  # 데모 시연 시 자동 인증 우회가 필요하면 auth_basic off; 로 끄거나 IP allowlist 추가.

  server {
    listen 80;
    server_name _;

    auth_basic           "Kitchen Solution Platform - Demo";
    auth_basic_user_file /etc/nginx/htpasswd;

    # API (FastAPI)
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger / OpenAPI
    location /docs {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }
    location /openapi.json {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # 모든 그 외 → frontend (Next.js)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Next.js 정적 자산 캐시 통과 — basic auth 가 매 요청마다 검사 (시연용엔 OK)
    }
  }

  # ── HTTPS 활성화 시 (도메인 + Let's Encrypt cert 있을 때) ──
  # server {
  #   listen 443 ssl http2;
  #   server_name your-demo-domain.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   auth_basic           "Kitchen Solution Platform - Demo";
  #   auth_basic_user_file /etc/nginx/htpasswd;
  #   # location 블록은 위 :80 server 와 동일하게 복사
  # }
  #
  # # :80 → :443 redirect
  # server {
  #   listen 80;
  #   server_name your-demo-domain.com;
  #   return 301 https://$host$request_uri;
  # }
}
